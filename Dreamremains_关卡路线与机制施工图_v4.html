<title>Dreamremains 关卡路线与机制施工图 v4</title>
<style>
:root {
  color-scheme: light dark;
  --background: light-dark(#ffffff, #181818);
  --foreground: light-dark(#1a1c1f, #f7f7f7);
  --muted-foreground: light-dark(#667085, #a7adb7);
  --border: light-dark(#d0d5dd, #454a52);
  --blue: light-dark(#2563eb, #60a5fa);
  --orange: light-dark(#d97706, #f59e0b);
  --purple: light-dark(#7c3aed, #a78bfa);
  --green: light-dark(#16803a, #4ade80);
  --yellow: light-dark(#b7791f, #facc15);
  --red: light-dark(#c62828, #f87171);
  --font-sans: Inter, "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "Cascadia Mono", "Microsoft YaHei", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--background); color: var(--foreground); }
body { padding: 24px; font-family: var(--font-sans); }
.viz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--background) 96%, var(--foreground)); }
.text-small { font-size: 13px; line-height: 1.45; }
.text-muted { color: var(--muted-foreground); }
.viz-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.form-label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted-foreground); }
.form-select, .btn { min-height: 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--background); color: var(--foreground); padding: 7px 10px; font: inherit; }
.btn { cursor: pointer; }
.btn:hover { border-color: var(--blue); }
strong { color: var(--foreground); }
</style>
</head>

      const legendByLayer = {
        overview: [['main','','主线必经'],['optional','','可选探索'],['hidden','','塔罗隐藏路'],['symbol','T1–T4','塔罗交互点'],['symbol','CP','检查点'],['symbol','SP/IN','起点/场景入口'],['symbol','END','正式终点'],['symbol','TRANS','场景切换']],
        terrain: [['symbol','PL','普通平台'],['symbol','MP','移动平台'],['symbol','FP','计时消失平台；E12/E18载体'],['symbol','DP','永久消失平台；本图未放置'],['symbol','TH','塔罗隐藏平台'],['symbol','SG','尖刺'],['symbol','H','深渊危险区']],
        points: [['symbol','SP/IN','入口'],['symbol','END','终点'],['symbol','TRANS','场景切换'],['symbol','T1–T4','塔罗点'],['symbol','CP','检查点'],['symbol','EN','怪物'],['symbol','IT','收集品'],['symbol','TRG','机关触发器'],['symbol','D','门'],['symbol','FE/FA','折叠入口/落点'],['symbol','RT','Camera Room切换线']],

        camera: [['symbol','CAM','镜头构图段'],['symbol','RT','Camera Room切换触发器'],['symbol','4U','工程相机半高'],['symbol','16:9','约14.22U×8U视野']],
        all: [['main','','主线'],['optional','','可选'],['hidden','','隐藏'],['fold','','折叠'],['symbol','点位','PL/MP/FP/TH/SG/H/EN/IT/T/CP/TRG/D/TRANS/RT'],['symbol','策划范围','Zone/LAB/TEST/SYN/VA/AW/CB/HP/CAM']]

      const sx = x => 50 + x * 50;
      const sy = y => 70 + y * 50;
      const line = (x1,y1,x2,y2,cls) => `<line x1="${sx(x1)}" y1="${sy(y1)}" x2="${sx(x2)}" y2="${sy(y2)}" class="${cls}"/>`;
      const polyline = (points, cls) => `<polyline points="${points.map(([x,y]) => `${sx(x)},${sy(y)}`).join(' ')}" class="${cls}"/>`;
      const label = (x,y,text,cls='platform-label',anchor='start') => `<text x="${sx(x)}" y="${sy(y)}" class="${cls}" text-anchor="${anchor}">${text}</text>`;

      function defs() {
        return `<defs>
          <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="var(--blue)"/></marker>
          <marker id="arrow-blue-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9 0L0 3L9 6Z" fill="var(--blue)"/></marker>
          <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="var(--red)"/></marker>
          <marker id="arrow-red-start" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9 0L0 3L9 6Z" fill="var(--red)"/></marker>
          <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="var(--orange)"/></marker>
          <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="var(--purple)"/></marker>
          <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="var(--green)"/></marker>
          <pattern id="killzone-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
            <rect width="14" height="14" fill="color-mix(in srgb, var(--red) 4%, transparent)"/>
            <line x1="0" y1="0" x2="0" y2="14" stroke="var(--red)" stroke-width="3" opacity=".42"/>
          </pattern>
        </defs>`;
      }

      function drawGrid(scene) {
        let out = `<rect x="1" y="1" width="1598" height="500" rx="4" class="map-frame"/>`;
        for (let x = 0; x <= 30; x += 1) out += line(x,0,x,8,x % 5 === 0 ? 'grid-line grid-major' : 'grid-line');
        for (let y = 0; y <= 8; y += 1) out += line(0,y,30,y,y % 2 === 0 ? 'grid-line grid-major' : 'grid-line');
        for (let x = 0; x <= 30; x += 5) out += label(x,-.18,String(x),'grid-label','middle');
        for (let y = 0; y <= 8; y += 2) out += label(-.25,y+.08,String(y),'grid-label','end');
        for (let i = 0; i < scene.zones.length; i += 1) {
          const left = scene.bounds[i]; const right = scene.bounds[i+1];
          out += `<rect x="${sx(left)}" y="${sy(0)}" width="${(right-left)*50}" height="400" class="${scene === scenes.A ? 'zone-fill-a' : 'zone-fill-b'}" opacity="${i%2 ? .45 : .8}"/>`;
          if (i > 0) out += line(left,0,left,8,'zone-boundary');
          out += label((left+right)/2,.36,scene.zones[i],'zone-label','middle');
        }
        return out;
      }

      function terrainMarkup(scene, ghost=false) {
        let out = `<g class="${ghost ? 'ghost' : ''}">`;
        scene.abysses.forEach(([id,x1,x2]) => {
          out += `<rect x="${sx(x1)}" y="${sy(6.15)}" width="${(x2-x1)*50}" height="92" class="killzone"/>`;
          if (!ghost) out += label((x1+x2)/2,7.48,`${id}｜深渊危险区`,'platform-label','middle');
        });
        scene.platforms.forEach(([id,x,y,w,type]) => {
          const cls = type === 'moving' ? 'moving' : type === 'fading' ? 'fading' : type === 'hidden' ? 'hidden-platform' : scene === scenes.B ? 'platform-b' : 'platform';
          out += `<rect x="${sx(x)}" y="${sy(y)}" width="${w*50}" height="16" rx="2" class="${cls}"/>`;
          if (!ghost && !id.endsWith('b') && !id.endsWith('c')) out += label(x+w/2,y-.12,id,'platform-label','middle');
        });
        scene.spikes.forEach(([id,x,y,w]) => {
          const teeth = Math.max(2,Math.round(w*3));
          let d = `M${sx(x)} ${sy(y)}`;
          for (let i=0;i<teeth;i+=1) d += `L${sx(x)+(i+.5)*(w*50/teeth)} ${sy(y)-18}L${sx(x)+(i+1)*(w*50/teeth)} ${sy(y)}`;
          out += `<path d="${d}Z" class="spike"/>`;
          out += `<rect x="${sx(x)-4}" y="${sy(y)-35}" width="${w*50+8}" height="39" rx="3" class="spike-envelope"/>`;
          if (!ghost) out += label(x+w/2,y+.62,id,'platform-label','middle');
        });
        scene.moves.forEach(([id,x,y1,y2]) => {
          out += line(x,y1,x,y2,'move-range');
          if (!ghost) out += label(x+.15,(y1+y2)/2,id,'mechanism-label');
        });
        out += '</g>';
        return out;
      }

      function pointMarkup(scene) {
        let out = '<g>';
        scene.rt.forEach(([id,x]) => {
          out += line(x,.7,x,7.9,'rt-line');
          out += label(x+.08,.92,id,'point-label');
        });
        scene.patrols.forEach(([id,x1,x2,y]) => {
          out += line(x1,y,x2,y,'patrol');
          out += label((x1+x2)/2,y-.18,`${id}巡逻`,'mechanism-label','middle');
        });
        scene.points.forEach(([id,short,x,y,type]) => {
          const cls = `node ${type}`;
          if (type === 'door') {
            out += `<rect x="${sx(x)-10}" y="${sy(y)-28}" width="20" height="56" rx="2" class="${cls}"/>`;
          } else if (type === 'fold') {
            out += `<rect x="${sx(x)-12}" y="${sy(y)-21}" width="24" height="42" rx="10" class="${cls}"/>`;
          } else {
            out += `<circle cx="${sx(x)}" cy="${sy(y)}" r="17" class="${cls}"/>`;
          }
          out += `<text x="${sx(x)}" y="${sy(y)+5}" class="point-label" text-anchor="middle">${short}</text>`;
          out += label(x,y-.48,id,'point-label','middle');
        });
        out += '</g>';
        return out;
      }

      function routeMarkup(scene) {
        let out = '<g>';
        out += polyline(scene.routes.main,'main-route');
        out += label(2.2,6.75,'MAIN · 必经主线','route-label');
        scene.routes.optional.forEach((route,index) => {
          out += polyline(route.points,'optional-route');
          const [x,y] = route.points[Math.floor(route.points.length/2)];
          out += label(x,y-(index ? .28 : .35),route.label,'route-label','middle');
        });
        scene.routes.hidden.forEach(route => {
          out += polyline(route.points,'hidden-route');
          const [x,y] = route.points[1];
          out += label(x,y-.28,route.label,'route-label');
        });
        scene.routes.fold.forEach(route => {
          out += polyline(route.points,'fold-route');
          const [x,y] = route.points[1];
          out += label(x,y-.26,route.label,'mechanism-label','middle');
        });
        (scene.routes.notes || []).forEach(([id,x,y,note]) => {
          out += label(x,y,`${id}｜${note}`,'guide-note','middle');
        });
        out += '</g>';
        return out;
      }

      function overviewPointMarkup(scene) {
        const major = scene.points.filter(([id]) =>
          id === 'END' || /^T[1-4]$/.test(id) || /^(SP|IN|CP|TRANS)-/.test(id)
        );
        let out = '<g>';
        major.forEach(([id,short,x,y,type]) => {
          const cls = `node ${type}`;
          out += `<circle cx="${sx(x)}" cy="${sy(y)}" r="17" class="${cls}"/>`;
          out += `<text x="${sx(x)}" y="${sy(y)+5}" class="point-label" text-anchor="middle">${short}</text>`;
          out += label(x,y-.48,id,'point-label','middle');
        });
        out += '</g>';
        return out;
      }

      function carrierMarkup(scene) {
        let out = '<g>';
        scene.planningAreas.forEach(([id,x,y,w,h,note]) => {
          out += `<rect x="${sx(x)}" y="${sy(y)}" width="${w*50}" height="${h*50}" rx="7" class="planning-area"/>`;
          out += label(x+.12,y+.38,id,'mechanism-label');
          out += label(x+.12,y+h-.18,note,'guide-note');
        });
        out += label(.35,7.82,'本层矩形仅表示牌效作用范围，不生成可见美术或碰撞；实现说明见配套文档。','guide-note');
        out += '</g>';
        return out;
      }

      function tarotMarkup(scene) {
        let out = '<g>';
        scene.tarotFlow.forEach(([id,x,y,w,h,title,note,stage,group],index) => {
          const cls = stage === 'learn' ? 'learn-area' : stage === 'test' ? 'test-area' : 'synthesis-area';
          out += `<rect x="${sx(x)}" y="${sy(y)}" width="${w*50}" height="${h*50}" rx="7" class="${cls}"/>`;
          out += label(x+w*.5,y+h*.52,id,'mechanism-label','middle');
          if (scene.tarotFlow[index+1] && scene.tarotFlow[index+1][8] === group) {
            const next = scene.tarotFlow[index+1];
            out += line(x+w,y+h*.55,next[1],next[2]+next[4]*.55,'learn-arrow');
          }
        });
        scene.points.filter(point => /^T[1-4]$/.test(point[0]) || point[0].startsWith('CP-') || point[0].startsWith('TRG-')).forEach(([id,short,x,y,type]) => {
          const cls = `node ${type}`;
          out += `<circle cx="${sx(x)}" cy="${sy(y)}" r="17" class="${cls}"/>`;
          out += `<text x="${sx(x)}" y="${sy(y)+5}" class="point-label" text-anchor="middle">${short}</text>`;
          out += label(x,y-.48,id,'point-label','middle');
        });
        scene.routes.hidden.forEach(route => { out += polyline(route.points,'hidden-route'); });
        out += label(.35,7.82,'流程：T → LAB → TEST → 下一RT锁定快照 → SYN → 解锁对应隐藏路；详细定义见配套文档。','guide-note');
        out += '</g>';
        return out;
      }

      function cameraMarkup(scene) {
        let out = '<g>';
        scene.rooms.forEach(([id,x1,x2],index) => {
          out += `<rect x="${sx(x1)+4}" y="${sy(.72)}" width="${(x2-x1)*50-8}" height="${7.0*50}" rx="5" class="camera-room" opacity="${index%2 ? .72 : 1}"/>`;
          out += label((x1+x2)/2,1.18,id,'camera-label','middle');
          out += label((x1+x2)/2,1.55,index === 0 ? '进入时建立构图' : 'RT切换后跟随','guide-note','middle');
        });
        scene.rt.forEach(([id,x]) => {
          out += line(x,.7,x,7.9,'rt-line');
          out += label(x+.08,7.65,`${id} · 镜头切换`,'point-label');
        });
        out += label(.35,7.95,'当前工程：Cinemachine OrthographicSize=4；1920×1080时视野约14.22U×8U。图中CAM框只表达分镜范围，不是最终Unity尺寸。','guide-note');
        out += '</g>';
        return out;
      }

      function renderLegend(layer) {
        legend.innerHTML = legendByLayer[layer].map(([type,symbol,text]) => {
          if (type === 'symbol') return `<span class="legend-item"><span class="legend-symbol">${symbol}</span>${text}</span>`;
          return `<span class="legend-item"><span class="legend-line ${type}"></span>${text}</span>`;
        }).join('');
      }

      function render() {
        const sceneKey = sceneSelect.value;
        const layer = layerSelect.value;
        const scene = scenes[sceneKey];
        let body = drawGrid(scene);
        if (layer === 'overview') body += terrainMarkup(scene,false) + routeMarkup(scene) + overviewPointMarkup(scene);
        if (layer === 'terrain') body += terrainMarkup(scene,false);
        if (layer === 'points') body += terrainMarkup(scene,true) + pointMarkup(scene);
        if (layer === 'routes') body += terrainMarkup(scene,true) + routeMarkup(scene);
        if (layer === 'carriers') body += terrainMarkup(scene,true) + carrierMarkup(scene);
        if (layer === 'tarot') body += terrainMarkup(scene,true) + tarotMarkup(scene);
        if (layer === 'camera') body += terrainMarkup(scene,true) + cameraMarkup(scene);
        if (layer === 'all') body += terrainMarkup(scene,false) + pointMarkup(scene) + routeMarkup(scene) + carrierMarkup(scene) + tarotMarkup(scene);
        body += label(0,8.55,'X：0–30宏观格　Y：0–8宏观格　平台矩形=碰撞骨架；路线箭头≠实际地面','guide-note');
        const svg = document.createElementNS(NS,'svg');
        svg.setAttribute('class','construction-map');
        svg.setAttribute('viewBox','0 0 1600 535');
        svg.setAttribute('role','img');
        svg.setAttribute('aria-label',`${scene.title} ${statuses[layer]}`);
        svg.innerHTML = defs() + body;
        mapWrap.replaceChildren(svg);
        status.textContent = `${scene.title}｜${statuses[layer]}`;
        renderLegend(layer);
      }

      sceneSelect.addEventListener('change',render);
      layerSelect.addEventListener('change',render);
      downloadButton.addEventListener('click',() => {
        const svg = mapWrap.querySelector('svg');
        if (!svg) return;
        const serialized = new XMLSerializer().serializeToString(svg);
        const blob = new Blob([serialized],{type:'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = `Dreamremains_${sceneSelect.value}_${layerSelect.value}.svg`;
        anchor.click();
        URL.revokeObjectURL(url);
      });
      render();
    })();
  </script>
</div>

</body>
</html>
